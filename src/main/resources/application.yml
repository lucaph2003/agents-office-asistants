server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-office
  threads:
    virtual:
      enabled: true
  task:
    execution:
      simple:
        # Local models serve one request at a time; more parallel pipelines only queue up in Ollama.
        concurrency-limit: 2
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

agent-office:
  security:
    api-key: ${AGENT_OFFICE_API_KEY}
  pipeline:
    auto-start: ${PIPELINE_AUTO_START:true}
    max-attempts: 3
    max-output-attempts: 2
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    connect-timeout: 5s
    read-timeout: ${OLLAMA_READ_TIMEOUT:180s}
    max-attempts: 2
    retry-backoff: 2s
    temperature: 0.2
    think: false
    models:
      manager: ${OLLAMA_MODEL_MANAGER:${OLLAMA_MODEL:qwen3:8b}}
      research: ${OLLAMA_MODEL_RESEARCH:${OLLAMA_MODEL:qwen3:8b}}
      developer: ${OLLAMA_MODEL_DEVELOPER:${OLLAMA_MODEL:qwen3:8b}}
      reviewer: ${OLLAMA_MODEL_REVIEWER:${OLLAMA_MODEL:qwen3:8b}}

  trello:
    enabled: ${TRELLO_ENABLED:false}
    base-url: https://api.trello.com
    api-key: ${TRELLO_API_KEY:}
    token: ${TRELLO_TOKEN:}
    board-id: ${TRELLO_BOARD_ID:}
    connect-timeout: 5s
    read-timeout: 5s
    lists:
      inbox: ${TRELLO_LIST_INBOX:}
      planned: ${TRELLO_LIST_PLANNED:}
      in-progress: ${TRELLO_LIST_IN_PROGRESS:}
      review: ${TRELLO_LIST_REVIEW:}
      blocked: ${TRELLO_LIST_BLOCKED:}
      done: ${TRELLO_LIST_DONE:}

  office:
    # Live event stream for the pixel-art office view in office-ui/.
    enabled: ${OFFICE_STREAM_ENABLED:true}
    heartbeat: 15s

  notifications:
    n8n:
      enabled: ${N8N_NOTIFICATIONS_ENABLED:false}
      webhook-url: ${N8N_TASK_COMPLETED_WEBHOOK_URL:}
      token: ${N8N_WEBHOOK_TOKEN:}
      connect-timeout: 3s
      read-timeout: 5s

logging:
  pattern:
    correlation: '[%X{correlationId:-}] '

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Agent Office
    version: '@project.version@'
